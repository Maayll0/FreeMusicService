services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicdb_pass}
      POSTGRES_DB: ${POSTGRES_DB:-musicdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port ${PORT}"
    volumes:
      - media_data:/app/media
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-musicdb}:${POSTGRES_PASSWORD:-musicdb_pass}@db:5432/${POSTGRES_DB:-musicdb}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db

volumes:
  postgres_data:
  media_data: